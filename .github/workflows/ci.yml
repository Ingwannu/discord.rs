name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_MIN_LINES: 90.0
  # Blocking jobs use a pinned toolchain so a new Rust release cannot turn
  # unrelated PRs red with new clippy lints (1.99 did on 2026-10-10:
  # double_must_use, chunks_exact_to_as_chunks). Bump it in a dedicated PR
  # when the non-blocking stable-canary job goes red. The MSRV job reads
  # Cargo.toml's rust-version instead.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  rust-check:
    name: rust-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (pinned)
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN" --component clippy,rustfmt --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Cargo check (all features)
        run: cargo check --all-features --locked

      - name: Cargo check (default features)
        run: cargo check --locked

      - name: Cargo check (examples, default features)
        run: cargo check --examples --locked

      - name: Cargo check (examples, all features)
        run: cargo check --examples --all-features --locked

      - name: Cargo test (all features)
        run: cargo test --all-features --locked --no-fail-fast

      - name: Cargo test (default features)
        run: cargo test --locked

      # trybuild compares rustc diagnostics against tests/ui/*.stderr, whose
      # wording changes between Rust releases, so the snapshots match this
      # pinned toolchain only. The msrv and stable-canary jobs still compile
      # tests/compile_fail.rs but skip it (no DISCORDRS_TRYBUILD). After
      # bumping RUST_TOOLCHAIN, regenerate the snapshots (see
      # discordrsdocs/docs/guide/testing-and-coverage.md).
      - name: Compile-fail snapshots (pinned toolchain only)
        env:
          DISCORDRS_TRYBUILD: "1"
        run: cargo test --locked --test compile_fail

      - name: Cargo clippy (all features)
        run: cargo clippy --all-features --all-targets --locked -- -D warnings

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings

      # Broken intra-doc links are only warnings by default, so they piled up
      # unnoticed (15 by 2026-10-11). Both feature sets: a link from ungated
      # docs to a feature-gated item breaks only under default features.
      - name: Rustdoc (all features, deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --all-features --no-deps --locked

      - name: Rustdoc (default features, deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (pinned)
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN" --component llvm-tools-preview --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --locked --lcov --output-path lcov.info --fail-under-lines ${{ env.COVERAGE_MIN_LINES }}

      - name: Validate LCOV scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lcov = Path("lcov.info").read_text()
          files = {line[3:].replace("\\", "/") for line in lcov.splitlines() if line.startswith("SF:")}
          src_files = {path for path in files if "/src/" in path}
          line_records = len(re.findall(r"^DA:", lcov, re.MULTILINE))
          required = ("src/http.rs", "src/voice_runtime.rs", "src/gateway/bot.rs", "src/event.rs")
          missing = [suffix for suffix in required if not any(path.endswith(suffix) for path in src_files)]
          if len(src_files) < 30 or line_records < 20_000 or missing:
              raise SystemExit(
                  "LCOV report is too narrow for Coveralls upload: "
                  f"src_files={len(src_files)} line_records={line_records} missing={missing}"
              )
          print(f"LCOV scope OK: {len(src_files)} source files, {line_records} line records")
          PY

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: lcov.info

  msrv:
    name: msrv
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The MSRV is Cargo.toml's rust-version (the all-features minimum);
      # reading it here keeps that field the single place to change.
      - name: Setup Rust (MSRV from Cargo.toml)
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "::error file=Cargo.toml::rust-version is missing"
            exit 1
          fi
          rustup set profile minimal
          rustup toolchain install "$msrv" --no-self-update
          rustup default "$msrv"
          rustc --version
          cargo --version

      - name: Cargo check (all targets, default features)
        run: cargo check --all-targets --locked

      - name: Cargo check (all targets, all features)
        run: cargo check --all-targets --all-features --locked

      - name: Cargo test (default features)
        run: cargo test --locked --no-fail-fast

      - name: Cargo test (all features)
        run: cargo test --all-features --locked --no-fail-fast

  stable-canary:
    name: stable-canary (non-blocking)
    runs-on: ubuntu-latest
    # Tracks the moving stable toolchain so new lints show up here first
    # without blocking merges; when it fails, bump RUST_TOOLCHAIN and fix
    # the lints in one PR.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (latest stable)
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component clippy --no-self-update
          rustup default stable
          rustc --version

      - name: Cargo clippy (all features)
        run: cargo clippy --all-features --all-targets --locked -- -D warnings

      - name: Cargo clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings

  feature-isolation:
    name: feature-isolation
    runs-on: ubuntu-latest
    # Users enable features one at a time (`gateway` without `cache`,
    # `voice` alone, ...), but the other jobs only build the default and
    # the full set, where a missing `cfg` or a feature-only import can hide.
    # Library code only: a cargo-hack powerset would be 2^9 builds for
    # little extra signal, so each feature is built alone instead.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (pinned)
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN" --component clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - name: Clippy each feature alone (library)
        run: |
          for feature in "" cache gateway collectors sharding zstd-stream voice voice-encode dave interactions; do
            echo "::group::features=[${feature}]"
            cargo clippy --lib --no-default-features ${feature:+--features "$feature"} --locked -- -D warnings
            echo "::endgroup::"
          done

  drift-tooling:
    name: drift-tooling
    runs-on: ubuntu-latest

    # Offline checks only: the drift report itself runs weekly in
    # api-drift.yml and never fails CI. These steps fail when the parser
    # breaks or when ci/api-drift-allowlist.toml stops matching src/ (a
    # renamed path helper, a new helper-built route without an entry).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python version
        run: python3 -c "import sys; assert sys.version_info >= (3, 11), sys.version; print(sys.version)"

      - name: Drift script unit tests
        run: python3 -m unittest discover -s ci/tests -v

      - name: Allowlist matches the crate
        run: python3 ci/api_drift.py --self-check
