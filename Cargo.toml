[package]
name = "discordrs"
version = "3.0.0"
edition = "2021"
rust-version = "1.88"
description = "discord.rs - Standalone Discord bot framework with Components V2, Gateway, and HTTP client"
authors = [
    "ingwannu <ingwannu@teamwicked.me>",
    "ingwannu <ingwannu@gmail.com>",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/discordrs"
repository = "https://github.com/Ingwannu/discord.rs"
homepage = "https://github.com/Ingwannu/discord.rs"
keywords = ["discord", "framework", "components", "modal", "bot"]
categories = ["api-bindings"]
# Repository tooling and the docs site are not needed to build or use the
# crate; shipping them only grows every download (the docs site alone holds
# a PDF manual).
exclude = [
    "ci/",
    ".github/",
    "discordrsdocs/",
    "docs/",
    "index.html",
    # Generators and the test-only golden corpus for the formatters; the
    # generated Rust table they produce stays in the package.
    "src/formatters/*.js",
    "src/formatters/escape_golden.json",
    # Test-only round trips of Discord's documented example payloads (about
    # 56 KB, regenerated by ci/doc_examples.py); compiled only under cfg(test).
    "src/model/doc_examples.rs",
    "src/model/doc_examples/",
    # The REST request goldens (src/http/tests/goldens.rs reads them);
    # test-only data, about 60 KB.
    "src/http/goldens/",
]

[features]
default = ["cache"]
gateway = [
    "dep:tokio-tungstenite",
    "dep:flate2",
    "dep:futures-util",
]
cache = []
collectors = ["gateway"]
sharding = ["gateway"]
zstd-stream = ["gateway", "dep:zstd"]
voice = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:aes-gcm",
    "dep:chacha20poly1305",
    "dep:opus-decoder",
]
voice-encode = ["voice", "dep:opus-rs"]
dave = ["voice", "dep:davey"]
interactions = [
    "dep:axum",
    "dep:ed25519-dalek",
]

# Code rules (discordrsdocs/docs/guide/architecture.md, "Code rules"). They
# apply to every target; CI's `clippy -D warnings` turns the warn level into
# errors too. Unit tests, integration tests, and examples opt out of the
# panicking and casting rules with a crate- or file-level
# `allow(..., reason = "...")`; library code may only silence one at a
# specific site with `#[expect(..., reason = "...")]`. src/lib.rs also
# forbids unsafe code outright; `deny` here leaves room for the allocator
# in tests/id_footprint.rs.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
as_conversions = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
clone_on_ref_ptr = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Encoded request bodies are shared between retries without copying
# (src/http/body.rs). Already in the tree through reqwest.
bytes = "1"
# `raw_value`: the gateway reads each frame as a shallow envelope and keeps the
# dispatch payload as a `RawValue` (no `Value` tree); see src/event.rs.
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }
futures-util = { version = "0.3", optional = true }
axum = { version = "0.8", optional = true }
ed25519-dalek = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "process"] }
tracing = "0.1"
url = "2"
aes-gcm = { version = "0.10", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
opus-decoder = { version = "0.1", optional = true }
opus-rs = { version = "0.1", optional = true }
davey = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
# Compile-fail tests (tests/compile_fail.rs). Pinned exactly because 1.0.122
# declares rust-version 1.88, our MSRV; the MSRV CI job compiles every test
# target, so a later trybuild that raises its rust-version must be a
# deliberate bump.
trybuild = "=1.0.122"

[[example]]
name = "cache_bot"
required-features = ["gateway", "cache"]

[[example]]
name = "collector_bot"
required-features = ["gateway", "collectors"]

[[example]]
name = "gateway_bot"
required-features = ["gateway"]

[[example]]
name = "interactions_endpoint"
required-features = ["interactions"]

[[example]]
name = "process_sharding_bot"
required-features = ["sharding"]

[[example]]
name = "sharding_bot"
required-features = ["sharding"]

[[example]]
name = "typed_interactions_endpoint"
required-features = ["interactions"]

[[example]]
name = "voice_bot"
required-features = ["voice"]

[[example]]
name = "live_dave_capture_bot"
required-features = ["gateway", "voice"]

[[example]]
name = "music_bot"
required-features = ["gateway", "voice", "voice-encode"]
