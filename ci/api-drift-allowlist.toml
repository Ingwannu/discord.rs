# Allowlist and settings for ci/api_drift.py (Discord API drift report).
#
# Every entry must carry a `reason` (15+ characters). An entry without a
# recorded reason silences drift forever, which turns the report into noise.
#
# The crate's routes come from the route manifest (src/http/routes.rs), the
# same table the REST transport executes; `--self-check` (CI, every PR) checks
# that every endpoint method is listed there and sends its row's route.
#
# Tables:
#   [[ignored_route]]     documented route deliberately not wrapped.
#   [[crate_only_route]]  crate route that is not a `<Route>` tag in the docs.
#   [[non_dispatch_event]] receive-event row that is a Gateway opcode, not a
#                         DISPATCH `t` name.
#   [[ignored_event]]     documented dispatch event deliberately not decoded.
#   [[crate_only_event]]  decoded event name the docs do not list.
#
# Paths may use the docs' spelling (`{channel.id}`) or `{}`; parameter names
# are ignored. Re-run `python3 ci/api_drift.py --self-check` after editing.

[settings]
docs_route_root = "developers"
# The changelog quotes routes that were later removed or renamed; counting
# them would report removed routes as "documented" forever.
docs_route_exclude = ["developers/change-log.mdx", "developers/change-log/"]
docs_events_page = "developers/events/gateway-events.mdx"
docs_events_section = "Receive Events"
route_manifest = "src/http/routes.rs"
# Sources whose functions are bound to the manifest rows (and scanned for
# endpoint methods missing from the manifest).
rest_sources = ["src/http.rs", "src/http/**/*.rs", "src/oauth2.rs"]
rest_sources_exclude = ["src/http/**/tests.rs", "src/http/**/tests/*"]
event_sources = ["src/event/decode.rs"]
event_name_pattern = '"([A-Z][A-Z0-9_]+)"\s*(?:=>|\|)'
# The raw escape hatch (`RestClient::request` / `request_discard` with a
# `RawRequest`): any method and path the caller chooses.
non_endpoint_functions = ["request", "request_discard"]
# The deprecated forwards' golden comparisons (`forward!` cases).
forward_goldens = "src/http/tests/goldens.rs"
direct_method_files = ["src/http.rs", "src/http/routes.rs", "src/http/paths.rs", "src/http/raw.rs"]
# Floors well below today's counts (docs 234 routes / 82 events, crate 240
# distinct manifest routes / 79 events). Falling under one means the extractor
# no longer understands the docs or the manifest, which must fail loudly
# instead of reporting everything as missing (or nothing as missing).
min_docs_routes = 150
min_crate_routes = 150
min_docs_events = 50
min_crate_events = 50

# --- Removed guild-ownership routes (deprecated in 3.0) -----------------------
# Discord removed guild creation by applications on 2025-07-15 and transferred
# bot-owned guilds to users, then dropped these routes from its docs. The
# wrappers stay for one major version with #[deprecated] so migrations get a
# warning; remove these entries together with the wrappers.

[[crate_only_route]]
method = "POST"
path = "/guilds"
reason = "Deprecated create_guild: guild creation by apps was removed on 2025-07-15."

[[crate_only_route]]
method = "DELETE"
path = "/guilds/{guild.id}"
reason = "Deprecated delete_guild: owner-only, and bots no longer own guilds."

[[crate_only_route]]
method = "POST"
path = "/guilds/templates/{template.code}"
reason = "Deprecated create_guild_from_template: shares the removed guild-creation capability."

[[crate_only_route]]
method = "POST"
path = "/guilds/{guild.id}/mfa"
reason = "Deprecated modify_guild_mfa_level: owner-only, and bots no longer own guilds."

# --- OAuth2 token endpoints ---------------------------------------------------

[[crate_only_route]]
method = "POST"
path = "/oauth2/token"
reason = "Documented in the OAuth2 URL table of developers/topics/oauth2.mdx, not as a <Route> tag."

[[crate_only_route]]
method = "POST"
path = "/oauth2/token/revoke"
reason = "Documented in the OAuth2 URL table of developers/topics/oauth2.mdx, not as a <Route> tag."

# --- Gateway opcodes listed among receive events ------------------------------
# The receive-events table mixes DISPATCH events with three opcodes that never
# arrive as a `t` name; src/gateway/client.rs handles them by opcode.

[[non_dispatch_event]]
name = "HELLO"
evidence = ["const OP_HELLO: u64 = 10;"]
reason = "Opcode 10, consumed by the gateway handshake before IDENTIFY; never a DISPATCH name."

[[non_dispatch_event]]
name = "RECONNECT"
evidence = ["const OP_RECONNECT: u64 = 7;"]
reason = "Opcode 7, handled by the gateway client's reconnect path; never a DISPATCH name."

[[non_dispatch_event]]
name = "INVALID_SESSION"
evidence = ["const OP_INVALID_SESSION: u64 = 9;"]
reason = "Opcode 9, handled by the gateway client's re-identify path; never a DISPATCH name."
